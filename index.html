<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=General+Sans:wght@400;600;700&family=Anonymous+Pro&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Toast -->
<div id="toast"></div>



<!-- Header -->
<header>
  <div class="logo">SD<span> · </span></div>

  <div class="stats-bar" id="statsBar">
    <div class="stat-pill"><b id="statTotal">0</b> total</div>
    <div class="stat-pill"><b id="statStudying">0</b> in progress</div>
    <div class="stat-pill"><b id="statDone">0</b> completed</div>
    <div class="stat-pill"><b id="statPct">0%</b></div>
  </div>

  <div class="header-right">
    <div class="search-wrap">
      <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search videos…">
    </div>

    <div class="divider-v"></div>

    <select id="sortSelect" class="sort-select" title="Sort playlists">
      <option value="original">Default order</option>
      <option value="dur-asc" selected>Duration: Short → Long</option>
      <option value="dur-desc">Duration: Long → Short</option>
      <option value="alpha">Title: A → Z</option>
    </select>

    <div class="divider-v"></div>

    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="studying">In Progress</button>
    <button class="filter-btn" data-filter="done">Completed</button>
    <button class="filter-btn" data-filter="undone">To-do</button>
  </div>
</header>

<!-- Modal -->
<div id="modal">
  <div class="modal-inner" id="modalInner">
    <div class="modal-topbar">
      <div class="modal-title" id="modalTitle">—</div>
      <div class="modal-actions">
        <a class="modal-btn" id="modalYtBtn" href="#" target="_blank" rel="noopener">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor">
            <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.2 3.5-6.2 3.5z"/>
          </svg>
          YouTube
        </a>
        <button class="modal-btn" id="modalStudyBtn">Mark In Progress</button>
        <button class="modal-btn" id="modalDoneBtn">Mark Complete</button>
        <button class="modal-btn close-btn" id="modalCloseBtn">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
          Close
        </button>
      </div>
    </div>
    <div class="video-frame">
      <iframe id="youtubePlayer" frameborder="0" allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>
  </div>
</div>

<!-- App -->
<div id="app"></div>

<!-- Keyboard hint -->
<div class="kbd-hint">
  <span class="kbd">Esc</span> close &nbsp;·&nbsp;
  <span class="kbd">S</span> in progress &nbsp;·&nbsp;
  <span class="kbd">D</span> complete
</div>

<script src="script.js"></script>
</body>
</html>
